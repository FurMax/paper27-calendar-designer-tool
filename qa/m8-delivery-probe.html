<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>M8 设备交付验证</title><link rel="stylesheet" href="/src/styles/app.css"><style>body{font:16px system-ui,sans-serif;max-width:640px;margin:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));line-height:1.6;color:#18201d}button{display:block;width:100%;min-height:48px;margin:12px 0;border:1px solid #3457d5;border-radius:8px;background:#3457d5;color:#fff;font:inherit}button:disabled{opacity:.45}pre{white-space:pre-wrap;word-break:break-all;padding:12px;background:#f2f4f2;border-radius:8px}small{color:#66706b}</style></head><body><h1>M8 设备交付验证</h1><p>仅用于设备技术验证。请先在正式编辑页面保存 12 个月照片，再返回此页。测试数据留在当前浏览器；不会自动下载或发送文件。</p><pre id="environment">正在读取…</pre><button id="prepare">准备 12 张 PNG</button><button id="share" disabled>实验：分享 12 张 PNG</button><button id="download" disabled>下载 ZIP 备用包</button><pre id="log" aria-live="polite"></pre><small>出现分享面板或下载提示不等于文件已到达“照片”。请检查实际目标中是否有全部 12 张 PNG，并记录设备、系统、浏览器版本和 HTTPS 地址。</small><script type="module">
import { loadProject } from '/src/persistence/indexedDb.ts';
import { renderFullSet, missingExportMonths } from '/src/export/exportController.ts';
import { packagePngZip } from '/src/export/zip.ts';
import { canShareFiles, shareFiles, startBrowserDownload } from '/src/export/delivery.ts';
const el=id=>document.getElementById(id),log=text=>{el('log').textContent+='\n'+text};let files=[],zipUrl=null;
async function environment(){const project=await loadProject(),missing=project?missingExportMonths(project):[];el('environment').textContent=JSON.stringify({secureContext:isSecureContext,shareAPI:typeof navigator.share==='function',canShareAPI:typeof navigator.canShare==='function',readyMonths:project?12-missing.length:0,missing},null,2);return project;}
const project=await environment().catch(error=>{log('读取失败：'+error.message);return null});el('prepare').disabled=!project||missingExportMonths(project).length>0;
el('prepare').onclick=async()=>{el('prepare').disabled=true;el('share').disabled=true;el('download').disabled=true;if(zipUrl){URL.revokeObjectURL(zipUrl);zipUrl=null;}files=[];log('开始生成');try{const rendered=await renderFullSet(project,p=>{if(p.phase==='rendering')el('log').textContent=`已完成 ${p.completed}/12；当前 ${p.current??'—'} 月`});files=rendered.map(item=>new File([item.blob],item.fileName,{type:'image/png'}));log('12 张 PNG 已准备，合计 '+files.reduce((n,f)=>n+f.size,0)+' 字节');const zip=await packagePngZip(rendered);zipUrl=URL.createObjectURL(zip);el('download').disabled=false;const capable=canShareFiles(files);el('share').disabled=!capable;log('canShare({files:12})='+capable+'；ZIP='+zip.size+' 字节');}catch(error){log('失败：'+error.message)}finally{el('prepare').disabled=false}};
el('share').onclick=async()=>{try{await shareFiles(files);log('分享 API 已返回；请到目标位置核对 12 张文件，不能据此认定存入“照片”。')}catch(error){log(error.name==='AbortError'?'用户取消分享。':'分享失败：'+error.name+': '+error.message)}};
el('download').onclick=()=>{if(zipUrl){startBrowserDownload(zipUrl,'Calendar-Design-Studio-2027.zip');log('已向浏览器发起 ZIP 下载；请检查实际文件。')}};
window.addEventListener('beforeunload',()=>{if(zipUrl)URL.revokeObjectURL(zipUrl)});
</script></body></html>
