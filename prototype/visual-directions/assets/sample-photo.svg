<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract concert portrait placeholder</title>
  <desc id="desc">A dark figure beneath blue and rose stage lights, used only as a prototype photo.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b43"/>
      <stop offset="0.5" stop-color="#314f91"/>
      <stop offset="1" stop-color="#c66c7d"/>
    </linearGradient>
    <radialGradient id="lightA" cx="0.2" cy="0.08" r="0.72">
      <stop offset="0" stop-color="#dce8ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#7ea8ff" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#7ea8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightB" cx="0.82" cy="0.12" r="0.66">
      <stop offset="0" stop-color="#ffd7df" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#ef8ea5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ef8ea5" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#lightA)"/>
  <rect width="1200" height="900" fill="url(#lightB)"/>
